<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slide 7 - Demo Screenshots</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="single">
  <main class="slide alt-b screenshot-slide" aria-label="Slide 7 demo screenshot placeholders">
    <section class="content">
      <header class="topbar">
        <div class="badge"><span class="badge-dot"></span>Demo Screenshots</div>
        <div class="campus">UI</div>
      </header>

      <div class="section-block" style="margin-top:54px">
        <p class="kicker">Product preview</p>
        <h1 class="title">Real interface screenshots<span class="accent">here.</span></h1>
        <p class="lead">Clean views prepared for dashboard, issuing, public verification, and certificate views.</p>
      </div>

      <div class="screenshot-grid">
        <article class="shot-frame">
          <div class="shot-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="shot-area"><img src="/linkedin-carousel/Dashboard.png" alt=""></div>
        </article>
        <article class="shot-frame">
          <div class="shot-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="shot-area"><img src="/linkedin-carousel/Issue.png" alt=""></div>
        </article>
        <article class="shot-frame">
          <div class="shot-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="shot-area"><img src="/linkedin-carousel/PublicVerify.png" alt=""></div>
        </article>
        <article class="shot-frame">
          <div class="shot-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="shot-area"><img src="/linkedin-carousel/Certificate.png" alt=""></div>
        </article>
      </div>

      <footer class="footer">
        <div>No fake screenshots used</div>
        <div class="page-number">07</div>
      </footer>
    </section>
  </main>
</body>

</html>
