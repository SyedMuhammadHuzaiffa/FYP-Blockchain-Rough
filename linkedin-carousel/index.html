<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkedIn Carousel - Blockchain Certificate Verification</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .quick-links {
      width: min(1080px, 100%);
      margin: 0 auto 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .quick-links a {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      padding: 0 13px;
      border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--glass-border));
      border-radius: 999px;
      color: var(--soft);
      background: var(--glass);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .quick-links a:hover {
      border-color: color-mix(in srgb, var(--primary) 44%, var(--glass-border));
      color: #ffffff;
    }
  </style>
</head>
<body class="index-page">
  <header class="index-header">
    <h1>LinkedIn Carousel Preview</h1>
    <p>Blockchain-Based Certificate Verification System · 1080x1080 slides</p>
  </header>

  <nav class="quick-links" aria-label="Open individual slides">
    <a href="./slide-1.html">Slide 1</a>
    <a href="./slide-2.html">Slide 2</a>
    <a href="./slide-3.html">Slide 3</a>
    <a href="./slide-4.html">Slide 4</a>
    <a href="./slide-5.html">Slide 5</a>
    <a href="./slide-6.html">Slide 6</a>
    <a href="./slide-7.html">Slide 7</a>
    <a href="./slide-8.html">Slide 8</a>
  </nav>

  <main class="slide-list">
    <iframe class="slide-frame" title="Slide 1 Cover" src="./slide-1.html"></iframe>
    <iframe class="slide-frame" title="Slide 2 Problem Statement" src="./slide-2.html"></iframe>
    <iframe class="slide-frame" title="Slide 3 Proposed Solution" src="./slide-3.html"></iframe>
    <iframe class="slide-frame" title="Slide 4 How It Works" src="./slide-4.html"></iframe>
    <iframe class="slide-frame" title="Slide 5 Key Features" src="./slide-5.html"></iframe>
    <iframe class="slide-frame" title="Slide 6 Tech Stack" src="./slide-6.html"></iframe>
    <iframe class="slide-frame" title="Slide 7 Demo Screenshots" src="./slide-7.html"></iframe>
    <iframe class="slide-frame" title="Slide 8 Closing Team Slide" src="./slide-8.html"></iframe>

</body>
</html>
